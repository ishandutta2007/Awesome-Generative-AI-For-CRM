<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="100%" height="340" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a13" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="textShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.9" />
    </filter>

    <style>
      .bg-grid {
        stroke: rgba(255, 255, 255, 0.035);
        stroke-width: 1;
      }
      .circuit-line {
        stroke-dasharray: 8 12;
        animation: flowDash 20s linear infinite;
      }
      .pulse-orb {
        animation: pulseScale 4s ease-in-out infinite alternate;
      }
      .float-pill-1 {
        animation: floatItem 5s ease-in-out infinite alternate;
      }
      .float-pill-2 {
        animation: floatItem 6.5s ease-in-out infinite alternate-reverse;
      }
      .float-pill-3 {
        animation: floatItem 5.5s ease-in-out 1s infinite alternate;
      }
      .float-pill-4 {
        animation: floatItem 7s ease-in-out 0.5s infinite alternate-reverse;
      }
      @keyframes flowDash {
        from { stroke-dashoffset: 200; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulseScale {
        0% { transform: scale(0.95); opacity: 0.35; }
        100% { transform: scale(1.15); opacity: 0.75; }
      }
      @keyframes floatItem {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-7px); }
      }
    </style>
  </defs>

  <!-- Card Background -->
  <rect width="1000" height="340" rx="20" fill="url(#bgGrad)" />
  <rect width="998" height="338" x="1" y="1" rx="19" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Background Grid Pattern -->
  <g class="bg-grid">
    <line x1="50" y1="0" x2="50" y2="340" />
    <line x1="150" y1="0" x2="150" y2="340" />
    <line x1="250" y1="0" x2="250" y2="340" />
    <line x1="350" y1="0" x2="350" y2="340" />
    <line x1="450" y1="0" x2="450" y2="340" />
    <line x1="550" y1="0" x2="550" y2="340" />
    <line x1="650" y1="0" x2="650" y2="340" />
    <line x1="750" y1="0" x2="750" y2="340" />
    <line x1="850" y1="0" x2="850" y2="340" />
    <line x1="950" y1="0" x2="950" y2="340" />
    <line x1="0" y1="60" x2="1000" y2="60" />
    <line x1="0" y1="130" x2="1000" y2="130" />
    <line x1="0" y1="200" x2="1000" y2="200" />
    <line x1="0" y1="270" x2="1000" y2="270" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="160" cy="80" r="120" fill="#6366f1" opacity="0.18" filter="url(#glow)" class="pulse-orb" />
  <circle cx="850" cy="240" r="130" fill="#ec4899" opacity="0.16" filter="url(#glow)" class="pulse-orb" />
  <circle cx="500" cy="170" r="100" fill="#06b6d4" opacity="0.1" filter="url(#glow)" class="pulse-orb" />

  <!-- Animated Dynamic Data/Circuit Flow Curves in Background -->
  <path d="M -20 180 Q 250 80, 500 170 T 1020 160" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.45" class="circuit-line" />
  <path d="M -20 120 Q 300 240, 600 120 T 1020 220" fill="none" stroke="#06b6d4" stroke-width="1.8" stroke-opacity="0.35" class="circuit-line" />
  <path d="M 100 350 Q 400 210, 700 290 T 1020 90" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.3" class="circuit-line" />

  <!-- Floating Dynamic Tech Pills (Arranged on periphery so center stays clear) -->
  <!-- Top Left Pill -->
  <g class="float-pill-1" transform="translate(60, 42)">
    <rect width="168" height="32" rx="16" fill="url(#pillGrad)" stroke="#6366f1" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="18" cy="16" r="4" fill="#6366f1" />
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">🤖 AI Copilots</text>
  </g>

  <!-- Top Right Pill -->
  <g class="float-pill-2" transform="translate(770, 42)">
    <rect width="175" height="32" rx="16" fill="url(#pillGrad)" stroke="#ec4899" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="18" cy="16" r="4" fill="#ec4899" />
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">⚡ Autonomous SDR</text>
  </g>

  <!-- Bottom Left Pill -->
  <g class="float-pill-3" transform="translate(60, 268)">
    <rect width="180" height="32" rx="16" fill="url(#pillGrad)" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="18" cy="16" r="4" fill="#06b6d4" />
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">🔌 MCP Protocol CRM</text>
  </g>

  <!-- Bottom Right Pill -->
  <g class="float-pill-4" transform="translate(765, 268)">
    <rect width="180" height="32" rx="16" fill="url(#pillGrad)" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="18" cy="16" r="4" fill="#8b5cf6" />
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">🧠 LLM Intelligence</text>
  </g>

  <!-- FOREGROUND CONTENT: Guaranteed high contrast and prominence -->
  <!-- Top Center Badge -->
  <g transform="translate(385, 48)">
    <rect width="230" height="26" rx="13" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" stroke-opacity="0.7" />
    <circle cx="14" cy="13" r="3.5" fill="#34d399" />
    <text x="26" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#c7d2fe" letter-spacing="1">CURATED AI ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <text x="500" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff" filter="url(#textShadow)" letter-spacing="-0.8">
    Awesome Generative AI for CRM
  </text>

  <!-- Subtitle -->
  <text x="500" y="196" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="#94a3b8" filter="url(#textShadow)">
    Autonomous Sales Agents • Enterprise AI Copilots • Open-Source CRM • Natural Language Ops
  </text>

  <!-- Tech Highlights Flow Row (Center Bottom Foreground) -->
  <g transform="translate(240, 226)">
    <!-- Feature 1 -->
    <rect width="155" height="26" rx="6" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <text x="77" y="17" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#cbd5e1">🎯 Lead Research &amp; ICP</text>

    <!-- Feature 2 -->
    <rect x="175" width="168" height="26" rx="6" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <text x="259" y="17" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#cbd5e1">🎙️ Real-time Call Coaching</text>

    <!-- Feature 3 -->
    <rect x="363" width="155" height="26" rx="6" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <text x="440" y="17" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#cbd5e1">🔒 Data Sovereignty</text>
  </g>
</svg>
